<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opulus Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5b5bd6;
            --primary-dark: #3d3db3;
            --accent: #ff6584;
            --ink: #1f1f3d;
            --muted: #6f6f8f;
            --card: #ffffff;
            --bg: #f7f8fc;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, rgba(91, 91, 214, 0.2), transparent 55%), var(--bg);
            color: var(--ink);
            padding: 24px;
        }

        .auth-card {
            width: min(440px, 100%);
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(99, 99, 145, 0.18);
            padding: 38px 38px 46px;
        }

        .auth-card h1 {
            margin: 0 0 6px;
            font-size: 1.9rem;
        }

        .auth-card p {
            margin-top: 0;
            color: var(--muted);
        }

        .tab-group {
            display: inline-flex;
            background: rgba(91, 91, 214, 0.08);
            border-radius: 999px;
            padding: 4px;
            margin: 28px 0 32px;
        }

        .tab-group button {
            border: none;
            background: transparent;
            color: var(--muted);
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-group button[aria-pressed="true"] {
            background: #fff;
            color: var(--primary);
            box-shadow: 0 12px 20px rgba(91, 91, 214, 0.18);
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            font-weight: 600;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(31, 31, 61, 0.15);
            font-size: 1rem;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.18);
        }

        .submit-btn {
            background: linear-gradient(120deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 28px rgba(91, 91, 214, 0.25);
        }

        .notice {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .feedback {
            min-height: 20px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .feedback[data-variant="error"] { color: #d64562; }
        .feedback[data-variant="success"] { color: #2d9d78; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            font-size: 0.95rem;
            text-decoration: none;
            color: var(--muted);
            font-weight: 500;
        }

        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <section class="auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Secure access to Opulus</h1>
        <p>Log in to continue where you left off or create a free account to start managing your finances.</p>

        <div class="tab-group" role="tablist">
            <button type="button" role="tab" aria-selected="true" aria-pressed="true" data-mode="login">Log in</button>
            <button type="button" role="tab" aria-selected="false" aria-pressed="false" data-mode="signup">Create account</button>
        </div>

        <form id="auth-form" novalidate>
            <div class="field" data-field="name" hidden>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" autocomplete="name" placeholder="Jordan Carter">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6" placeholder="Enter at least 6 characters">
            </div>
            <div class="field" data-field="confirm" hidden>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" placeholder="Re-enter password">
            </div>
            <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
            <button type="submit" class="submit-btn">Continue</button>
        </form>

        <p class="notice">By continuing you agree to the Opulus Terms of Service and Privacy Policy.</p>
        <a href="index.html" class="back-link">← Return to marketing site</a>
    </section>

    <script src="login.js"></script>
</body>
</html>
